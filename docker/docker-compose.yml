version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: telegram_bot_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: telegram_bot_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      # Kết nối đến MongoDB service phía trên
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: secretpassword
      ME_CONFIG_MONGODB_SERVER: mongodb
      # Tài khoản đăng nhập Web GUI của Mongo Express
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: adminpassword
    depends_on:
      - mongodb

volumes:
  mongodb_data:
    driver: local
